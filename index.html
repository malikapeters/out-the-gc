<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>out the gc — family day planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
/* Best available day card */
.best-day-card{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;text-decoration:none;color:var(--text);transition:border-color .15s;}
.best-day-card:hover{border-color:var(--accent);}
.best-day-card.all-ready{border-color:rgba(74,222,128,0.5);background:linear-gradient(135deg,rgba(74,222,128,0.10),var(--surface));}
.best-day-icon{font-size:36px;flex-shrink:0;}
.best-day-content{flex:1;min-width:0;}
.best-day-label{font-family:var(--font-display);font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;}
.best-day-date{font-family:var(--font-display);font-size:20px;font-weight:600;margin:2px 0;}
.best-day-avail{font-size:13px;color:var(--gold);font-weight:500;margin-top:3px;}
.best-day-card.all-ready .best-day-avail{color:var(--green);}
.best-day-people{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.best-day-smiley{font-size:28px;flex-shrink:0;}

/* Plan card */
.plan-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
.plan-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.plan-title{font-family:var(--font-display);font-size:16px;font-weight:600;}
.plan-edit-btn{background:var(--surface-2);color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.plan-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.plan-row:last-child{border-bottom:none;}
.plan-row .pr-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.plan-row .pr-label{font-size:11px;color:var(--text-dimmer);text-transform:uppercase;letter-spacing:0.06em;min-width:60px;}
.plan-row .pr-value{font-size:14px;flex:1;}

/* Countdown */
.countdown-card{display:flex;align-items:center;gap:10px;background:var(--accent-dim);border:1px solid rgba(108,123,255,0.3);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;}
.countdown-number{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--accent);}
.countdown-label{font-size:13px;color:var(--text-dim);}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center;text-decoration:none;color:var(--text);}
.stat-number{font-family:var(--font-display);font-size:22px;font-weight:700;}
.stat-label{font-size:11px;color:var(--text-dim);margin-top:2px;}

/* Nav cards */
.nav-cards{display:flex;flex-direction:column;gap:10px;}
.nav-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;text-decoration:none;color:var(--text);transition:border-color .15s;}
.nav-card:hover{border-color:var(--accent);}
.nav-card-icon{font-size:28px;flex-shrink:0;}
.nav-card-info{flex:1;}
.nav-card-title{font-family:var(--font-display);font-size:15px;font-weight:600;}
.nav-card-desc{font-size:12px;color:var(--text-dim);margin-top:2px;}
.nav-card-arrow{color:var(--text-dimmer);font-size:18px;}

/* Plan weather */
.plan-weather{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--text-dim);}
</style>
</head>
<body>
<div id="app"><div id="setup"></div></div>
<script src="shared.js"></script>
<script>
(function(){
  var $app=document.getElementById('app');
  var modalOpen=false;
  // Default plan until admin saves one to Firestore
  var DEFAULT_PLAN={venue:'Kirstenbosch Gardens',date:'2026-11-08',time:'TBD',notes:''};

  function getPlan(){return GC.data.plan||DEFAULT_PLAN;}

  // Find the date with the most people available
  function findMostAvailableDay(){
    if(!GC.data.availability.length||!GC.data.people.length)return null;
    var byDate={};
    GC.data.availability.forEach(function(a){
      if(!byDate[a.date])byDate[a.date]=[];
      byDate[a.date].push(a.personId);
    });
    var best=null;
    Object.keys(byDate).forEach(function(date){
      var ids=byDate[date];
      var count=ids.length;
      if(!best||count>best.count||(count===best.count&&date<best.date)){
        best={date:date,count:count,personIds:ids};
      }
    });
    return best;
  }

  function renderBestDay(today){
    var best=findMostAvailableDay();
    if(!best){
      return '<div class="best-day-card">'+
        '<div class="best-day-icon">🗓️</div>'+
        '<div class="best-day-content">'+
          '<div class="best-day-label">Most available day</div>'+
          '<div class="best-day-date" style="font-size:14px;color:var(--text-dim)">No one has marked availability yet</div>'+
          '<div class="best-day-avail">Go to the calendar to mark your availability</div>'+
        '</div></div>';
    }
    var total=GC.data.people.length;
    var allReady=best.count===total;
    var dateObj=new Date(best.date+'T00:00:00');
    var label=GC.fmtDayLabel(dateObj, today);
    var w=GC.getWeatherForDate(best.date);
    var weatherStr=w?GC.weatherDesc(w.code)+' • '+Math.round(w.tempMax)+'°C':'';
    var people=best.personIds.map(function(pid){
      var p=GC.data.people.find(function(pp){return pp.id===pid;});
      return p?'<span class="dot" style="background:'+p.color+'" title="'+GC.escapeHtml(p.name)+'"></span>':'';
    }).join('');
    return '<a class="best-day-card '+(allReady?'all-ready':'')+'" href="calendar.html">'+
      '<div class="best-day-icon">'+(w?GC.weatherEmoji(w.code):'🗓️')+'</div>'+
      '<div class="best-day-content">'+
        '<div class="best-day-label">Most available day</div>'+
        '<div class="best-day-date">'+GC.escapeHtml(label)+'</div>'+
        (weatherStr?'<div style="font-size:13px;color:var(--text-dim);margin-top:2px">'+GC.escapeHtml(weatherStr)+'</div>':'')+
        '<div class="best-day-avail">'+best.count+'/'+total+' available</div>'+
        '<div class="best-day-people">'+people+'</div>'+
      '</div>'+
      '<div class="best-day-smiley">😊</div>'+
    '</a>';
  }

  function renderPlanCard(me){
    var plan=getPlan();
    var dateObj=plan.date?new Date(plan.date+'T00:00:00'):null;
    var dateStr=dateObj?dateObj.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Not set';
    var weatherHtml='';
    if(dateObj){
      var w=GC.getWeatherForDate(GC.toWeatherDateStr(dateObj));
      if(w){
        weatherHtml='<div class="plan-weather">'+
          GC.weatherEmoji(w.code)+' '+GC.weatherDesc(w.code)+
          ' • '+Math.round(w.tempMax)+'°/'+Math.round(w.tempMin)+'°C'+
          ' • 💧 '+w.precipProb+'%'+
        '</div>';
      }
    }
    var editBtn=GC.isAdmin(me)?'<button class="plan-edit-btn" id="edit-plan-btn">Edit plan</button>':'';
    return '<div class="plan-card">'+
      '<div class="plan-header">'+
        '<div class="plan-title">🌿 Girl Cousin Day Plan</div>'+
        editBtn+
      '</div>'+
      '<div class="plan-row"><span class="pr-icon">📍</span><span class="pr-label">Where</span><span class="pr-value">'+GC.escapeHtml(plan.venue||'Not set')+'</span></div>'+
      '<div class="plan-row"><span class="pr-icon">📅</span><span class="pr-label">When</span><span class="pr-value">'+GC.escapeHtml(dateStr)+'</span></div>'+
      '<div class="plan-row"><span class="pr-icon">🕐</span><span class="pr-label">Time</span><span class="pr-value">'+GC.escapeHtml(plan.time||'TBD')+'</span></div>'+
      (plan.notes?'<div class="plan-row"><span class="pr-icon">📝</span><span class="pr-label">Notes</span><span class="pr-value">'+GC.escapeHtml(plan.notes)+'</span></div>':'')+
      weatherHtml+
    '</div>';
  }

  function renderCountdown(){
    var plan=getPlan();
    if(!plan.date)return '';
    var today=GC.startOfDay(new Date());
    var planDate=GC.startOfDay(new Date(plan.date+'T00:00:00'));
    var diff=Math.round((planDate-today)/86400000);
    if(diff<0)return '';
    var label=diff===0?'It\'s today!':diff===1?'1 day to go!':diff+' days to go';
    return '<div class="countdown-card">'+
      '<div class="countdown-number">'+(diff===0?'🎉':diff)+'</div>'+
      '<div class="countdown-label">'+label+'</div>'+
    '</div>';
  }

  function renderStats(){
    var plan=getPlan();
    var planDateStr=plan.date?GC.toWeatherDateStr(new Date(plan.date+'T00:00:00')):'';
    var availOnPlan=planDateStr?GC.availableCount(planDateStr):0;
    var giftCount=(GC.data.gifts||[]).length;
    var crewCount=GC.data.people.length;
    return '<div class="stats-row">'+
      '<div class="stat-card">'+
        '<div class="stat-number">'+crewCount+'</div>'+
        '<div class="stat-label">in the crew</div>'+
      '</div>'+
      '<div class="stat-card">'+
        '<div class="stat-number">'+availOnPlan+'</div>'+
        '<div class="stat-label">available on the day</div>'+
      '</div>'+
      '<a class="stat-card" href="gifts.html">'+
        '<div class="stat-number">'+giftCount+'</div>'+
        '<div class="stat-label">gifts pledged</div>'+
      '</a>'+
    '</div>';
  }

  function renderNavCards(){
    return '<div class="nav-cards">'+
      '<a class="nav-card" href="calendar.html">'+
        '<div class="nav-card-icon">📅</div>'+
        '<div class="nav-card-info">'+
          '<div class="nav-card-title">Calendar</div>'+
          '<div class="nav-card-desc">Mark your availability and see everyone\'s schedule</div>'+
        '</div>'+
        '<div class="nav-card-arrow">›</div>'+
      '</a>'+
      '<a class="nav-card" href="gifts.html">'+
        '<div class="nav-card-icon">🎁</div>'+
        '<div class="nav-card-info">'+
          '<div class="nav-card-title">Gift Exchange</div>'+
          '<div class="nav-card-desc">See what everyone\'s bringing and add yours</div>'+
        '</div>'+
        '<div class="nav-card-arrow">›</div>'+
      '</a>'+
    '</div>';
  }

  function render(){
    var me=GC.data.people.find(function(p){return p.id===GC.myId;});
    if(!me){GC.renderSetup($app,render);return;}
    var today=GC.startOfDay(new Date());
    $app.innerHTML=
      '<nav class="nav-bar">'+
        '<a href="index.html" class="nav-link active">Home</a>'+
        '<a href="calendar.html" class="nav-link">Calendar</a>'+
        '<a href="gifts.html" class="nav-link">Gifts</a>'+
      '</nav>'+
      '<header class="top">'+
        '<div>'+
          '<h1>out the <span>gc</span></h1>'+
          '<div class="tagline"><span class="sync-dot"></span>synced • family day planner</div>'+
        '</div>'+
        '<div class="me-chip" id="switch-me"><span class="dot" style="background:'+me.color+'"></span>'+GC.escapeHtml(me.name)+'</div>'+
      '</header>'+
      renderBestDay(today)+
      renderCountdown()+
      '<div class="section-title">Girl Cousin Day Plan</div>'+
      renderPlanCard(me)+
      '<div class="section-title">Quick stats</div>'+
      renderStats()+
      '<div class="section-title">Navigate</div>'+
      renderNavCards()+
      '<div class="hint-box">'+
        '<b>How it works:</b> The dashboard shows the day most cousins are available and the current plan. '+
        'Go to the <b>Calendar</b> to mark your availability, and the <b>Gift Exchange</b> to say what you\'re bringing. '+
        'Everything syncs automatically across everyone\'s phones.'+
      '</div>';

    document.getElementById('switch-me').addEventListener('click',function(){
      GC.myId=null;GC.saveMyId('');render();
    });
    var editBtn=document.getElementById('edit-plan-btn');
    if(editBtn)editBtn.addEventListener('click',function(){openPlanModal();});
  }

  // Admin plan editor modal
  function openPlanModal(){
    modalOpen=true;
    var plan=getPlan();
    var backdrop=document.createElement('div');
    backdrop.className='modal-backdrop';
    backdrop.innerHTML=
      '<div class="modal-sheet">'+
        '<h3>Edit plan</h3>'+
        '<div class="modal-sub">Update the details for the girl cousin day.</div>'+
        '<label class="field-label">Venue</label>'+
        '<input type="text" id="p-venue" value="'+GC.escapeHtml(plan.venue||'')+'" maxlength="60">'+
        '<label class="field-label">Date</label>'+
        '<input type="date" id="p-date" value="'+(plan.date||'')+'">'+
        '<label class="field-label">Time</label>'+
        '<input type="text" id="p-time" value="'+GC.escapeHtml(plan.time||'')+'" placeholder="e.g. 10:00am or TBD" maxlength="30">'+
        '<label class="field-label">Notes</label>'+
        '<input type="text" id="p-notes" value="'+GC.escapeHtml(plan.notes||'')+'" placeholder="Anything else to note" maxlength="120">'+
        '<div class="modal-actions">'+
          '<button class="btn-secondary" id="p-cancel">Cancel</button>'+
          '<button class="btn-primary" id="p-save">Save</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(backdrop);
    backdrop.querySelector('#p-cancel').addEventListener('click',function(){
      document.body.removeChild(backdrop);modalOpen=false;
    });
    backdrop.querySelector('#p-save').addEventListener('click',async function(){
      GC.data.plan={
        venue:backdrop.querySelector('#p-venue').value.trim(),
        date:backdrop.querySelector('#p-date').value,
        time:backdrop.querySelector('#p-time').value.trim()||'TBD',
        notes:backdrop.querySelector('#p-notes').value.trim()
      };
      await GC.savePlan();
      document.body.removeChild(backdrop);
      modalOpen=false;
      render();
    });
  }

  function handleUpdate(){if(modalOpen)return;render();}

  function boot(){
    GC.myId=GC.loadMyId();
    if(GC.NOT_CONFIGURED){
      $app.innerHTML='<div style="padding:40px 20px;text-align:center;color:var(--text-dim);font-size:14px;line-height:1.6;"><b style="color:var(--text)">Firebase isn\'t set up yet.</b><br><br>Open shared.js and paste your Firebase project config.</div>';
      return;
    }
    $app.innerHTML='<div style="padding:60px 20px;text-align:center;color:var(--text-dim);font-size:13px;">Loading…</div>';
    GC.fetchWeather();
    GC.subscribeToData(handleUpdate);
    setInterval(function(){GC.fetchWeather();},30*60*1000);
  }

  boot();
})();
</script>
</body>
</html>
